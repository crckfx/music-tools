<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../_crckfx/numbin/numbin.css">
    <title>PIANO WIDGET</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../controls-panel.css">
    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet" href="../mt_numbin.css">

    <link rel="modulepreload" href="../core/global.js">
    <script type="module">
        import { applyProfileToElement } from '../core/global.js';
        applyProfileToElement(document.getElementById('app'), 'showcase');
    </script>
</head>

<body>

    <div id="start-overlay">
        <div class="overlay-inner">
            <div class="overlay-label">showcase</div>
            <h1 class="overlay-title">PianoWidget</h1>
            <p class="overlay-sub">touch-optimised · polyphonic · web audio</p>
            <button id="start-btn">
                <span class="btn-ring"></span>
                START
            </button>
        </div>
    </div>

    <div id="app">
        <header id="app-header">
            <a href="../" class="back-link">← back</a>
            <span class="app-title">PianoWidget</span>
            <span class="range-label" id="range-label"></span>
        </header>

        <main id="app-main">
            <div class="stage">
                <div class="stage-glow"></div>

                <div class="controls-panel">
                    <div class="controls-row">
                        <span class="row-label">Piano</span>
                        <div class="control-group">
                            <label for="num-keys">Number of keys</label>
                            <div id="nb-num-keys" class="numbin" data-value="30" data-min="12" data-max="64" data-step="1">
                                <input type="number" id="num-keys">
                            </div>
                        </div>
                        <div class="control-group">
                            <label for="keys-range-start">Starting Key</label>
                            <div class="numbin midi-numbin" id="nb-keys-range-start" data-value="60" data-min="0" data-max="127" data-step="1">
                                <input type="number" id="keys-range-start">
                            </div>
                        </div>
                    </div>
                    <div class="controls-row">
                        <span class="row-label">Keyboard</span>
                        <div class="controls-row">
                            <div class="control-group">
                                <label for="kb-octave">Octave</label>
                                <select id="kb-octave">
                                    <option value="1">Z: C1 / Q: C2</option>
                                    <option value="2">Z: C2 / Q: C3</option>
                                    <option value="3" selected>Z: C3 / Q: C4</option>
                                    <option value="4">Z: C4 / Q: C5</option>
                                    <option value="5">Z: C5 / Q: C6</option>
                                    <option value="6">Z: C6 / Q: C7</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="nudge-row">
                    <div class="nudge-group">
                        <button class="nudge-btn" id="oct-down">−8va</button>
                        <button class="nudge-btn" id="semi-down">−♩</button>
                    </div>
                    <div class="nudge-group">
                        <button class="nudge-btn" id="semi-up">+♩</button>
                        <button class="nudge-btn" id="oct-up">+8va</button>
                    </div>
                </div>


                <div id="container">
                    <!-- not a real nudge row just another row -->
                    <!-- although 2 dumb spans with space-between is almost it -->
                    <!-- still, to do it properly you'd need to center x to the corresponding note "A3", "C#6", etc. -->
                    <!-- maybe you could do something with css variables that get set by the widget. 
                     eg. when starting and ending note are known, notify a left and a right channel. 
                     we essentially draw (with html) something that corresponds to the canvas.
                     or it could be case based AND canvas linked. whatever's easiest.
                     though we'd need to ensure it can handle a canvas that overflows. so maybe it's tough.
                      -->
                    <div class="dumb-row">
                        <!-- these things actually spill onto the piano; 
                         it's a nice way to test their alignment -->
                        <span class="note left">hi</span>
                        <span class="note right">doug</span>
                    </div>
                    <canvas id="piano"></canvas>
                </div>

                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">LIVE</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initAllNumbins, initNumbin } from "../_crckfx/numbin/Numbin.js";
        import {MidiNumbin} from "../_crckfx/numbin/MidiNumbin.js";
        // initAllNumbins();
        const nb_keysRangeStart = document.getElementById('nb-keys-range-start');

        initNumbin(document.getElementById('nb-num-keys'));
        // initNumbin(document.getElementById('nb-keys-range-start'));
        // const krsNumbin = new MidiNumbin(nb_keysRangeStart, {min: 0, max: 127});

    </script>
    <script type="module" src="./main.js"></script>
</body>

</html>
