<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIANO WIDGET</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../controls-panel.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="start-overlay">
        <div class="overlay-inner">
            <div class="overlay-label">triangle wave</div>
            <h1 class="overlay-title">PIANO WIDGET</h1>
            <p class="overlay-sub">touch-optimised · polyphonic · web audio</p>
            <button id="start-btn">
                <span class="btn-ring"></span>
                START
            </button>
        </div>
    </div>

    <div id="app">
        <header id="app-header">
            <a href="../" class="back-link">← back</a>
            <span class="app-title">PIANO WIDGET</span>
            <span class="range-label" id="range-label"></span>
        </header>

        <main id="app-main">
            <div class="stage">
                <div class="stage-glow"></div>

                <div class="controls-panel">
                    <div class="controls-row">
                        <span class="row-label">Display</span>
                        <div class="control-group">
                            <label for="num-keys">Number of keys</label>
                            <input type="number" id="num-keys" value="24" min="1" max="64" step="1">
                        </div>
                    </div>                    
                </div>

                <div class="nudge-row">
                    <div class="nudge-group">
                        <button class="nudge-btn" id="oct-down">−8va</button>
                        <button class="nudge-btn" id="semi-down">−♩</button>
                    </div>
                    <div class="nudge-group">
                        <button class="nudge-btn" id="semi-up">+♩</button>
                        <button class="nudge-btn" id="oct-up">+8va</button>
                    </div>
                </div>

                <div id="container">
                    <canvas id="piano"></canvas>
                </div>

                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">LIVE</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
