<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="../_external/numbin/numbin.css"> -->
    <title>PIANO WIDGET</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../controls-panel.css">
    <link rel="stylesheet" href="./style.css">


    <link rel="modulepreload" href="../core/global.js">
    <script type="module">
        import { applyProfileToElement } from '../core/global.js';
        applyProfileToElement(document.getElementById('app'), 'showcase');
    </script>        
</head>
<body>

    <div id="start-overlay">
        <div class="overlay-inner">
            <div class="overlay-label">showcase</div>
            <h1 class="overlay-title">PianoWidget</h1>
            <p class="overlay-sub">touch-optimised · polyphonic · web audio</p>
            <button id="start-btn">
                <span class="btn-ring"></span>
                START
            </button>
        </div>
    </div>

    <div id="app">
        <header id="app-header">
            <a href="../" class="back-link">← back</a>
            <span class="app-title">PianoWidget</span>
            <span class="range-label" id="range-label"></span>
        </header>

        <main id="app-main">
            <div class="stage">
                <div class="stage-glow"></div>

                <div class="controls-panel">
                    <div class="controls-row">
                        <span class="row-label">Piano</span>
                        <div class="control-group">
                            <label for="num-keys">Number of keys</label>
                            <input type="number" id="num-keys" value="30" min="1" max="64" step="1">
                            
                            <label for="keys-range-start">Starting Key</label>
                            <input type="number" id="keys-range-start">
                            <div class="numbin" data-value="0" data-min="0" data-max="127" data-step="1" data-loop="false"></div>

                        </div>
                    </div>                    
                </div>

                <div class="nudge-row">
                    <div class="nudge-group">
                        <button class="nudge-btn" id="oct-down">−8va</button>
                        <button class="nudge-btn" id="semi-down">−♩</button>
                    </div>
                    <div class="nudge-group">
                        <button class="nudge-btn" id="semi-up">+♩</button>
                        <button class="nudge-btn" id="oct-up">+8va</button>
                    </div>
                </div>

                <div id="container">
                    <canvas id="piano"></canvas>
                </div>

                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">LIVE</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
