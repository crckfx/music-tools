<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./tabs.css">
</head>

<body>

    <div id="app" class="visible">

        <header id="app-header">
            <a href="../" class="back-link">← back</a>
            <span class="app-title">TABS</span>
            <span class="range-label" id="range-label"></span>
        </header>

        <main id="app-main">
            <div class="stage">
                <div class="stage-glow"></div>

                <!-- ════════════════════════════════
                    CONTROLS PANEL
                ════════════════════════════════ -->
                <div class="controls-panel">
                    <!-- Row 1 · Scale identity -->
                    <div class="controls-row">
                        <span class="row-label">Scale</span>
                        <div class="control-group">
                            <label for="root">Root</label>
                            <select id="root"></select>
                        </div>
                        <div class="control-group">
                            <label for="scale">Type</label>
                            <select id="scale"></select>
                        </div>
                        <div class="controls-divider"></div>
                        <div class="control-group">
                            <label for="tuning">Tuning</label>
                            <select id="tuning"></select>
                        </div>
                    </div>

                    <!-- Row 2 · Fretboard mapping -->
                    <div class="controls-row">
                        <span class="row-label">Map</span>
                        <div class="control-group">
                            <label for="min-fret">Start fret</label>
                            <input type="number" id="min-fret" value="0" min="0" max="22" step="1">
                        </div>
                        <div class="control-group">
                            <label for="fret-span">Span</label>
                            <select id="fret-span">
                                <option value="4">4 frets</option>
                                <option value="5" selected>5 frets</option>
                                <option value="6">6 frets</option>
                                <option value="7">7 frets</option>
                                <option value="12">Full octave</option>
                                <option value="24">Full neck</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="notes-per-string">Notes/string</label>
                            <select id="notes-per-string">
                                <option value="0">Auto</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="string-order">String order</label>
                            <select id="string-order">
                                <option value="low-first">Low → High</option>
                                <option value="high-first">High → Low</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="dedup-pref">Prefer</label>
                            <select id="dedup-pref">
                                <option value="lowest-fret" selected>Lowest fret</option>
                                <option value="highest-fret">Highest fret</option>
                                <option value="lowest-string">Lowest string</option>
                                <option value="highest-string">Highest string</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 3 · Traversal pattern -->
                    <div class="controls-row">
                        <span class="row-label">Pattern</span>
                        <div class="control-group">
                            <label for="pattern">Direction</label>
                            <select id="pattern">
                                <option value="asc">Ascending ↑</option>
                                <option value="desc">Descending ↓</option>
                                <option value="both">Asc + Desc ↕</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 4 · Output annotation -->
                    <div class="controls-row">
                        <span class="row-label">Display</span>
                        <div class="control-group">
                            <label for="show-root">Root markers</label>
                            <input type="checkbox" id="show-root" checked>
                        </div>
                        <div class="control-group">
                            <label for="show-names">Note names</label>
                            <input type="checkbox" id="show-names" checked>
                        </div>
                    </div>

                    <!-- Row 5 · Text layout -->
                    <div class="controls-row">
                        <span class="row-label">Format</span>
                        <div class="control-group">
                            <label for="note-spacing">Note spacing</label>
                            <select id="note-spacing">
                                <option value="1">1 dash</option>
                                <option value="2" selected>2 dashes</option>
                                <option value="3">3 dashes</option>
                                <option value="4">4 dashes</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="line-width">Line width</label>
                            <select id="line-width">
                                <option value="40">40 chars</option>
                                <option value="60" selected>60 chars</option>
                                <option value="80">80 chars</option>
                                <option value="100">100 chars</option>
                                <option value="120">120 chars</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="pad-before">Pad before</label>
                            <select id="pad-before">
                                <option value="0">0</option>
                                <option value="1" selected>1</option>
                                <option value="2">2</option>
                                <option value="4">4</option>
                                <option value="8">8</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="pad-after">Pad after</label>
                            <select id="pad-after">
                                <option value="0" selected>0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="4">4</option>
                                <option value="8">8</option>
                                <option value="fill">Fill</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 6 · Octave nudge (piano range shift) -->
                    <div class="nudge-row" style="margin-bottom:0;">
                        <div class="nudge-group">
                            <button class="nudge-btn" id="shift-oct-down">−8va</button>
                            <button class="nudge-btn" id="shift-semi-down">−♩</button>
                        </div>
                        <span class="fret-badge" id="fret-badge">fret 0</span>
                        <div class="nudge-group">
                            <button class="nudge-btn" id="shift-semi-up">+♩</button>
                            <button class="nudge-btn" id="shift-oct-up">+8va</button>
                        </div>
                    </div>

                </div>

                <!-- ════════════════════════════════
                    PIANO WIDGET
                ════════════════════════════════ -->
                <div id="container">
                    <canvas id="piano"></canvas>
                </div>

                <!-- ════════════════════════════════
                    TAB OUTPUT
                ════════════════════════════════ -->
                <div class="tab-section">
                    <div class="tab-header">
                        <span class="tab-title" id="tab-title">—</span>
                        <button class="copy-btn" id="copy-btn">copy</button>
                    </div>
                    <div class="tab-output-wrap">
                        <pre id="tab-output"></pre>
                    </div>
                </div>

                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">LIVE</span>
                </div>

            </div>
        </main>

    </div>

    <script type="module" src="./tabs.js"></script>
</body>

</html>
