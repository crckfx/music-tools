<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        html, body { overflow: auto; }

        #app-main {
            overflow: visible;
            align-items: flex-start;
            padding-bottom: 48px;
        }

        /* ── Controls panel ── */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-group label {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .control-group select,
        .control-group input[type="number"] {
            background: var(--bg-raised);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            padding: 5px 8px;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .control-group input[type="number"] {
            width: 58px;
            -webkit-appearance: textfield;
            appearance: textfield;
        }

        .control-group select:focus,
        .control-group input:focus {
            border-color: var(--accent);
        }

        .control-group input[type="checkbox"] {
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .controls-divider {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 2px;
            flex-shrink: 0;
        }

        .row-label {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.7;
            padding: 2px 0;
            margin-right: 4px;
        }

        /* ── Tab output ── */
        .tab-section {
            position: relative;
            z-index: 1;
            margin-top: 20px;
        }

        .tab-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 12px;
        }

        .tab-title {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            padding: 5px 14px;
            background: var(--bg-raised);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            color: var(--text);
            border-color: var(--accent-dim);
        }

        .copy-btn.copied {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .tab-output-wrap {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            overflow-x: auto;
            box-shadow:
                0 0 0 1px var(--border),
                0 4px 20px rgba(0,0,0,0.35);
        }

        #tab-output {
            display: block;
            font-family: var(--font-mono);
            font-size: clamp(0.72rem, 1.8vw, 0.85rem);
            line-height: 1.6;
            color: var(--text);
            padding: 18px 22px;
            white-space: pre;
            margin: 0;
            min-height: 80px;
        }

        /* ── Fret info badge ── */
        .fret-badge {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 8px;
        }
    </style>
</head>
<body>

<div id="app" class="visible">

    <header id="app-header">
        <a href="../" class="back-link">← back</a>
        <span class="app-title">TABS</span>
        <span class="range-label" id="range-label"></span>
    </header>

    <main id="app-main">
        <div class="stage">
            <div class="stage-glow"></div>

            <!-- ════════════════════════════════
                 CONTROLS PANEL
            ════════════════════════════════ -->
            <div class="controls-panel">

                <!-- Row 1 · Scale identity -->
                <div class="controls-row">
                    <span class="row-label">Scale</span>
                    <div class="control-group">
                        <label for="root">Root</label>
                        <select id="root"></select>
                    </div>
                    <div class="control-group">
                        <label for="scale">Type</label>
                        <select id="scale"></select>
                    </div>
                    <div class="controls-divider"></div>
                    <div class="control-group">
                        <label for="tuning">Tuning</label>
                        <select id="tuning"></select>
                    </div>
                </div>

                <!-- Row 2 · Mapping rules -->
                <div class="controls-row">
                    <span class="row-label">Map</span>
                    <div class="control-group">
                        <label for="min-fret">Start fret</label>
                        <input type="number" id="min-fret" value="0" min="0" max="22" step="1">
                    </div>
                    <div class="control-group">
                        <label for="fret-span">Span</label>
                        <select id="fret-span">
                            <option value="4">4 frets</option>
                            <option value="5" selected>5 frets</option>
                            <option value="6">6 frets</option>
                            <option value="7">7 frets</option>
                            <option value="12">Full octave</option>
                            <option value="24">Full neck</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="notes-per-string">Notes/string</label>
                        <select id="notes-per-string">
                            <option value="0">Auto</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="string-order">String order</label>
                        <select id="string-order">
                            <option value="low-first">Low → High</option>
                            <option value="high-first">High → Low</option>
                        </select>
                    </div>
                </div>

                <!-- Row 3 · Interpolation / pattern -->
                <div class="controls-row">
                    <span class="row-label">Pattern</span>
                    <div class="control-group">
                        <label for="pattern">Direction</label>
                        <select id="pattern">
                            <option value="asc">Ascending ↑</option>
                            <option value="desc">Descending ↓</option>
                            <option value="both">Asc + Desc ↕</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="skip-empty">Skip empty strings</label>
                        <input type="checkbox" id="skip-empty" checked>
                    </div>
                </div>

                <!-- Row 4 · Formatting -->
                <div class="controls-row">
                    <span class="row-label">Format</span>
                    <div class="control-group">
                        <label for="note-spacing">Note spacing</label>
                        <select id="note-spacing">
                            <option value="1">1 dash</option>
                            <option value="2" selected>2 dashes</option>
                            <option value="3">3 dashes</option>
                            <option value="4">4 dashes</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="line-width">Line width</label>
                        <select id="line-width">
                            <option value="40">40 chars</option>
                            <option value="60" selected>60 chars</option>
                            <option value="80">80 chars</option>
                            <option value="100">100 chars</option>
                            <option value="120">120 chars</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="show-names">Note names</label>
                        <input type="checkbox" id="show-names">
                    </div>
                </div>

                <!-- Row 5 · Octave nudge (piano range shift) -->
                <div class="nudge-row" style="margin-bottom:0;">
                    <div class="nudge-group">
                        <button class="nudge-btn" id="shift-oct-down">−8va</button>
                        <button class="nudge-btn" id="shift-semi-down">−♩</button>
                    </div>
                    <span class="fret-badge" id="fret-badge">fret 0</span>
                    <div class="nudge-group">
                        <button class="nudge-btn" id="shift-semi-up">+♩</button>
                        <button class="nudge-btn" id="shift-oct-up">+8va</button>
                    </div>
                </div>

            </div>

            <!-- ════════════════════════════════
                 PIANO WIDGET
            ════════════════════════════════ -->
            <div id="container">
                <canvas id="piano"></canvas>
            </div>

            <!-- ════════════════════════════════
                 TAB OUTPUT
            ════════════════════════════════ -->
            <div class="tab-section">
                <div class="tab-header">
                    <span class="tab-title" id="tab-title">—</span>
                    <button class="copy-btn" id="copy-btn">copy</button>
                </div>
                <div class="tab-output-wrap">
                    <pre id="tab-output"></pre>
                </div>
            </div>

            <div class="live-indicator">
                <span class="live-dot"></span>
                <span class="live-text">LIVE</span>
            </div>

        </div>
    </main>

</div>

<script type="module" src="./tabs.js"></script>
</body>
</html>
